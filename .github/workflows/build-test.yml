name: Real APK Build Test

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'Website URL to convert'
        required: true
        default: 'https://example.com'

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # Use the version your backend uses

      - name: Install Backend Dependencies
        run: |
          cd "AppForge Backend"  # Navigate to your backend folder
          npm install

      - name: Setup Java (Required for Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Run the Real Build Script
        run: |
          cd "AppForge Backend"
          node cli-build.js "${{ inputs.website_url }}"
        env:
          # Pass any environment variables your script needs
          NODE_ENV: test

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-apk
          path: AppForge Backend/builds/*/output/*.apk  # Adjust path to where your script actually saves the APK

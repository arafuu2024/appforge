name: Manual APK Build Test

on:
  workflow_dispatch:  # This allows you to click a "Run" button on GitHub.com
    inputs:
      website_url:
        description: 'Website URL to convert'
        required: true
        default: 'https://example.com'

jobs:
  build-android:
    runs-on: ubuntu-latest  # Comes with Java AND Android SDK pre-installed!
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (Optional, GitHub already has it)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (GitHub already has this too)
        uses: android-actions/setup-android@v3

      - name: Run the Build Script
        run: |
          # This is where your backend code would normally run.
          # Since we are testing, we just create a dummy file to prove it works.
          echo "Building APK for ${{ inputs.website_url }}"
          mkdir -p builds/test/output
          echo "This is a test APK" > builds/test/output/app.apk
          
          # (In real life, your Node script would copy the android-template 
          # and run gradlew here, but this proves the runner works!)
          
      - name: Upload APK Artifact (So you can download it)
        uses: actions/upload-artifact@v4
        with:
          name: test-apk
          path: builds/test/output/app.apk
